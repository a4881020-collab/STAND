<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAND</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #172033;
      text-align: center;
    }
    header {
      padding: 24px;
      background: #172033;
      color: white;
    }
    .logo {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #72d5d0;
    }
    main { padding: 35px 18px; }
    .welcome {
      background: white;
      max-width: 420px;
      margin: auto;
      padding: 28px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #00000012;
    }
    h1 { color: #172033; }
    p { line-height: 1.8; color: #647084; }
    button {
      background: #172033;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 13px 25px;
      font-size: 16px;
      margin-top: 15px;
    }
    footer { margin-top: 35px; color: #8992a3; }
  </style>
</head>
<body>
  <header>
    <div class="logo">ST</div>
    <div>STAND — Social Platform</div>
  </header>

  <main>
    <section class="welcome">
      <h1>مرحباً بك في STAND</h1>
      <p>مساحة جديدة للتواصل، مشاركة اللحظات، واكتشاف العالم.</p>
      <p>Welcome to STAND</p>
      <button onclick="alert('قريباً: إنشاء حساب STAND')">
        ابدأ الآن
      </button>
    </section>
    <footer>STAND © 2026</footer>
  </main>
</body>
</html>
